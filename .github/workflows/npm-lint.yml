name: NPM Lint
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

defaults:
  run:
    working-directory: ./

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '20.4.x'

      - uses: actions/cache@v3
        id: npm-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install JavaScript Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - uses: actions/cache@v3
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('.eslintrc.cjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ hashFiles('.eslintrc.cjs', 'package-lock.json') }}-

      - name: ESLint
        run: npm run lint
